# Default options of the packaged clang for --target=x86_64-pc-linux-gnu (clang reads <triple>.cfg next to
# itself). The programs Treadle builds link compiler-rt's builtins and start-up files instead of libgcc and
# GCC's crtbegin, so a system needs glibc's development files (libc6-dev) but no GCC (docs/Releasing.md).
--rtlib=compiler-rt
--unwindlib=none
